name: Deploy to GitHub Pages

# Pages cannot run the Rust backend, so the backend runs here instead: the
# same binary enumerates the full API parameter space and writes every
# response to a file. The published site is generated by the real handlers,
# not by a reimplementation.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      # The maths is the product here; a failing test must not reach Pages.
      - name: Test
        run: cargo test --release --locked

      - name: Build the static site
        run: |
          cargo build --release --locked
          ./target/release/chromatex --emit-static dist
          # Stop Pages from running the output through Jekyll.
          touch dist/.nojekyll
          echo "files: $(find dist -type f | wc -l)  size: $(du -sh dist | cut -f1)"

      - name: Verify the export is complete
        run: |
          set -e
          test -f dist/index.html
          test -f dist/data/static.json
          test -f dist/data/catalog.json
          test -f dist/data/series/tan-8.json
          test -f dist/data/matrix/6-128.json
          test -f dist/data/palette/128.json
          test -f dist/vendor/katex.min.css
          # Every exported response must be a success payload.
          ! grep -rl '"ok":false' dist/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
